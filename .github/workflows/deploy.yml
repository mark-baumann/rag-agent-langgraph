name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      service_name:
        required: false
        type: string
        default: "dokumenten-agent"
        description: "Docker-Compose service name"
      port:
        required: false
        type: string
        default: "8512"
        description: "Service port"

jobs:
  deploy:
    uses: mark-baumann/infrastruktur-deployment/.github/workflows/build-deploy.yml@master
    with:
      service_name: ${{ inputs.service_name || 'dokumenten-agent' }}
      port: ${{ inputs.port || '8512' }}
    secrets: inherit
